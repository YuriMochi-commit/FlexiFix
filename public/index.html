<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FlexiFit</title>
<meta name="theme-color" content="#EE4B2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: phone = bottom tab bar, tablet/desktop = side rail + wide content grid. Role decides which shell renders. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface2:#ECEEF5; --ink:#14161C; --muted:#5F6678; --line:#E1E4EE;
  --accent:#EE4B2B; --accent-ink:#FFFFFF; --accent-soft:#FDE6E0;
  --teal:#0B9A8A; --teal-soft:#DDF3F0; --gold:#A8730F; --gold-soft:#F8EBCB; --violet:#5F4FCB; --violet-soft:#E6E2FA;
  --good:#16866A; --warn:#B7791F; --bad:#C93A3A; --bad-soft:#FBE3E3; --warn-soft:#FAEBCF; --good-soft:#DCF2EA;
  --shadow:0 1px 2px rgba(20,22,28,.06),0 6px 20px rgba(20,22,28,.05);
  --f-display:"Space Grotesk","Noto Sans Myanmar",system-ui,sans-serif;
  --f-body:"Noto Sans Myanmar","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F14; --surface:#161A22; --surface2:#1E232E; --ink:#ECEEF5; --muted:#9AA2B5; --line:#272C38;
  --accent:#FF6A4A; --accent-ink:#1A0B07; --accent-soft:#3A1E17;
  --teal:#2CC9B6; --teal-soft:#123532; --gold:#E4B455; --gold-soft:#372C14; --violet:#9C8DFF; --violet-soft:#25214A;
  --good:#3DD1A0; --warn:#E8B04A; --bad:#FF7A7A; --bad-soft:#3C1D1F; --warn-soft:#382B12; --good-soft:#123428;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F14; --surface:#161A22; --surface2:#1E232E; --ink:#ECEEF5; --muted:#9AA2B5; --line:#272C38;
  --accent:#FF6A4A; --accent-ink:#1A0B07; --accent-soft:#3A1E17;
  --teal:#2CC9B6; --teal-soft:#123532; --gold:#E4B455; --gold-soft:#372C14; --violet:#9C8DFF; --violet-soft:#25214A;
  --good:#3DD1A0; --warn:#E8B04A; --bad:#FF7A7A; --bad-soft:#3C1D1F; --warn-soft:#382B12; --good-soft:#123428;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:1.25rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.82rem}
/* shell */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:20px;padding-block:16px 100px}
.rail{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button,.rail button.nv{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);padding:6px 8px;border-radius:12px;font-size:.7rem;min-width:0;flex:1}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--accent)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.logo svg{width:20px;height:20px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;position:relative}
.iconbtn svg{width:20px;height:20px}
.dot{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--accent-ink);font-size:.65rem;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;font-family:var(--f-display)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.grid.c4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid.tiny{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid.tiny .card{padding:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.hero{background:linear-gradient(135deg,var(--surface2),var(--surface));overflow:hidden;position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 12px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.chip.normal{background:var(--surface2);color:var(--muted)}
.chip.premium{background:var(--gold-soft);color:var(--gold)}
.chip.pt{background:var(--violet-soft);color:var(--violet)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:4px 12px;font-size:.85rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;width:100%;min-width:0}
.form{display:grid;gap:12px;grid-template-columns:1fr}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.5rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.teal i{background:var(--teal)}.bar.violet i{background:var(--violet)}.bar.gold i{background:var(--gold)}
.banner{border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.bad{background:var(--bad-soft);color:var(--bad)}.banner.info{background:var(--teal-soft);color:var(--teal)}
.banner p{flex:1 1 200px;min-width:0}
.ring{position:relative;display:grid;place-items:center}
.ring svg{display:block}
.ring .mid{position:absolute;text-align:center;line-height:1.3}
.ring .mid b{font-family:var(--f-display);font-size:1.7rem;display:block;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:.75rem;text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);letter-spacing:.02em}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 14px;font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.md h4{font-family:var(--f-display);margin:12px 0 4px;font-size:1rem}
.md ul{margin:4px 0 8px;padding-left:20px}.md li{margin:2px 0}
.meal{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .tm{font-family:var(--f-display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;font-weight:600;max-width:calc(100vw - 32px)}
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:40;display:grid;place-items:end center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
/* login */
.login{min-height:100vh;display:grid;align-items:center;padding-block:28px}
.login-grid{max-width:960px;margin:0 auto;display:grid;gap:20px;grid-template-columns:1fr;width:100%}
.splash{border-radius:24px;padding:28px;background:linear-gradient(150deg,#1B1F2B,#0F1218 60%);color:#F3F4F8;position:relative;overflow:hidden;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.splash h1{font-size:2.1rem;letter-spacing:-.02em}
.splash .glow{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 68%);opacity:.5}
.hint{display:flex;gap:6px;flex-wrap:wrap}
.hint button{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:2px 10px;font-size:.78rem}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.wk{display:flex;gap:4px;align-items:flex-end;height:64px}
.wk i{flex:1;border-radius:6px 6px 2px 2px;background:var(--surface2);min-height:6px}
.wk i.on{background:var(--teal)}
svg .ax{stroke:var(--line);stroke-width:1}
svg .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
svg .ar{fill:var(--accent-soft)}
svg .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg text{fill:var(--muted);font-size:10px;font-family:var(--f-display)}
@media (min-width:640px){
  .grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form .full{grid-column:1/-1}
  .overlay{place-items:center}.sheet{border-radius:22px}
  .login-grid{grid-template-columns:1.1fr 1fr}
}
@media (min-width:900px){
  .shell{grid-template-columns:230px minmax(0,1fr);padding-block:24px 40px;align-items:start}
  .nav{display:none}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);padding-top:8px}
  .rail button.nv{flex-direction:row;gap:12px;font-size:.95rem;justify-content:flex-start;padding:10px 14px;flex:none;text-align:left}
  .rail button.nv svg{width:20px;height:20px;flex:none}
  .rail button.nv[aria-current="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
  .grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .toast{bottom:28px}
}
@media (min-width:640px) and (max-width:899px){
  .grid.c3,.grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.btn:active{transform:scale(.98)}}
[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, updatePassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, onSnapshot, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
/* ---------- helpers ---------- */
const DAY=864e5;
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>{const x=new Date(d);const day=x.getDate();x.setMonth(x.getMonth()+n);if(x.getDate()!==day)x.setDate(0);return x};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n).toLocaleString("en-US")+" ကျပ်";
const MM=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fdate=d=>(typeof d==="string"?parse(d):d).getDate()+" "+MM[(typeof d==="string"?parse(d):d).getMonth()]+" "+(typeof d==="string"?parse(d):d).getFullYear();
const fmtMin=m=>{m=Math.max(0,Math.round(m));return Math.floor(m/60)+" နာရီ "+pad(m%60)+" မိနစ်"};
const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)};

const TIERS={normal:{n:"Normal",price:35000},premium:{n:"Premium",price:70000},pt:{n:"PT Player",price:160000}};
const GOALS={lose:"ကိုယ်အလေးချိန် လျှော့ချင်",gain:"ကိုယ်အလေးချိန် တင်ချင်",muscle:"ကြွက်သား တည်ဆောက်ချင်",fit:"ကျန်းမာရေး / Fit ဖြစ်ချင်"};
const PROTOCOLS=[{f:14,n:"14:10",d:"စတင်သူများ"},{f:16,n:"16:8",d:"လူကြိုက်အများဆုံး"},{f:18,n:"18:6",d:"အလယ်အလတ်"},{f:20,n:"20:4",d:"အဆင့်မြင့်"},{f:23,n:"OMAD",d:"တစ်နပ်စား"}];
const CLASSES=[["Yoga 07:00","Stretch & Mobility 18:00"],["HIIT 18:30","Boxing 19:30"],["Zumba 18:00","Core 19:15"],["Spin 06:30","Yoga 18:30"],["Boxing 18:30","HIIT 19:30"],["Strength Lab 17:30","Zumba 18:45"],["Open Gym 08:00","Yoga 09:30"]];

/* ---------- pure logic ---------- */
function expiryOf(m){return addMonths(parse(m.start),m.months)}
function daysLeft(m,now){const t=now||today0();return Math.round((expiryOf(m)-t)/DAY)}
function statusOf(m,now){const d=daysLeft(m,now);return d<0?"expired":d<=7?"soon":"active"}
function bmi(m){const h=m.height/100;return m.weight/(h*h)}
function bmiLabel(b){return b<18.5?"ပိန်":b<23?"သာမန်":b<27.5?"အဝလွန်ကင်း":"အဝလွန်"}
function fastState(f,now){
  now=now||new Date();
  if(!f||!f.on)return{phase:"off"};
  const nd=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const start=parse(f.startDate);
  if(nd<start)return{phase:"scheduled",days:Math.round((start-nd)/DAY)};
  const dayNo=Math.floor((nd-start)/DAY)+1;
  if(dayNo>f.days)return{phase:"done",dayNo:f.days};
  const p=f.eatStart.split(":").map(Number);
  const eatLen=(24-f.fast)*60,fastLen=f.fast*60;
  const diff=((now.getHours()*60+now.getMinutes())-(p[0]*60+p[1])+1440)%1440;
  if(diff<eatLen)return{phase:"eating",dayNo,remain:eatLen-diff,pct:diff/eatLen};
  const el=diff-eatLen;
  return{phase:"fasting",dayNo,remain:fastLen-el,pct:el/fastLen};
}
function streakOf(list,now){
  const set=new Set(list||[]);let d=now?new Date(now):today0();d.setHours(0,0,0,0);
  if(!set.has(ymd(d)))d=addDays(d,-1);
  let n=0;while(set.has(ymd(d))){n++;d=addDays(d,-1)}return n;
}
function calcNeeds(m){
  const bmr=10*m.weight+6.25*m.height-5*m.age+(m.sex==="M"?5:-161);
  const adj={lose:-400,gain:350,muscle:250,fit:0}[m.goal]||0;
  const kcal=Math.round((bmr*1.5+adj)/10)*10;
  const protein=Math.round(m.weight*(m.goal==="fit"?1.4:1.8));
  return{bmr:Math.round(bmr),kcal,protein};
}
function monthStats(m,now){
  now=now||new Date();
  const ym=now.getFullYear()+"-"+pad(now.getMonth()+1);
  const workouts=(m.att||[]).filter(d=>d.slice(0,7)===ym).length;
  const first=ym+"-01";
  const logs=(m.wlog||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  let base=logs.length?logs[0].w:m.weight;
  logs.forEach(l=>{if(l.d<=first)base=l.w});
  const delta=+(m.weight-base).toFixed(1);
  const tgt=m.goalsM.delta;
  const pct=tgt===0?1:Math.max(0,Math.min(1,delta/tgt));
  return{workouts,delta,pct,wpct:Math.min(1,workouts/Math.max(1,m.goalsM.workouts))};
}
const MEALS={
  n:{b:["ကြက်ဥပြုတ် ၂ လုံး + ထမင်းကြော်အနည်းငယ် + သစ်သီး","အုတ်ဖတ် (Oats) + ငှက်ပျောသီး + ပဲနို့","ပေါင်မုန့်အမည်း ၂ ခု + ကြက်ဥ + ခရမ်းချဉ်သီး"],
     l:["ထမင်း ၁ ပန်းကန် + ကြက်သားကင်/ပြုတ် + ဟင်းသီးဟင်းရွက်ပြုတ်","ငါးဟင်း + ထမင်း + ပဲပင်ပေါက်ဆီပြန်","ကြက်သားချက် (ဆီနည်း) + ထမင်းအနည်းငယ် + အစိမ်းရောင်သုပ်"],
     s:["ဂျုံမှုန့်မဟုတ်သော ပဲပြုတ် + သစ်သီး","ဒိန်ချဉ် + အခွံမာသီးအနည်းငယ်","ကြက်ဥပြုတ် ၁ လုံး + သခွားသီး"],
     d:["ငါး/ပုစွန်ပြုတ် + ဟင်းသီးဟင်းရွက် + ထမင်းလက်တစ်ဆုပ်","ကြက်သားဟင်းချို + ပဲပြုတ် + သုပ်","ကြက်ဥသုပ် + ဘူးသီးဟင်း + ထမင်းအနည်းငယ်"]},
  v:{b:["အုတ်ဖတ် + ငှက်ပျောသီး + ပဲနို့","တို့ဟူးကြော် (ဆီနည်း) + ထမင်းကြော်အနည်းငယ်","ပေါင်မုန့်အမည်း + ပဲပုပ်ပျော့ + သစ်သီး"],

function localPlan(m,diet,seed,fs){
  const nd=calcNeeds(m);const set=MEALS[diet==="v"?"v":"n"];
  let slots;
  const pick=(k,i)=>set[k][(seed+i)%3];
  if(fs&&(fs.phase==="eating"||fs.phase==="fasting")&&m.fast.on){
    const s=m.fast.eatStart.split(":").map(Number),L=(24-m.fast.fast)*60,st=s[0]*60+s[1];
    const cnt=L>=480?4:L>=360?3:L>=180?2:1;
    const keys=cnt===4?["b","l","s","d"]:cnt===3?["l","s","d"]:cnt===2?["l","d"]:["d"];
    slots=keys.map((k,i)=>({t:hhmm(st+(cnt===1?0:Math.round(i*(L-60)/(cnt-1))),k),k}));
  }else{
    slots=[{t:"07:30",k:"b"},{t:"12:30",k:"l"},{t:"16:00",k:"s"},{t:"19:30",k:"d"}];
  }
  const w={b:.25,l:.35,s:.1,d:.3};const tot=slots.reduce((a,x)=>a+w[x.k],0);
  const names={b:"မနက်စာ",l:"နေ့လည်စာ",s:"ညနေ Snack",d:"ညစာ"};
  return{needs:nd,meals:slots.map((x,i)=>({time:x.t,name:names[x.k],food:pick(x.k,i),kcal:Math.round(nd.kcal*w[x.k]/tot/10)*10}))};
}
function localText(m,diet,seed,fs){

  return o;

function mdToHtml(t){
  const lines=esc(t).split("\n");let out="",inUl=false;
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  for(const raw of lines){
    const l=raw.trim();
    if(/^[-*] /.test(l)){if(!inUl){out+="<ul>";inUl=true}out+="<li>"+inline(l.slice(2))+"</li>";continue}
    if(inUl){out+="</ul>";inUl=false}
    if(/^#{1,4} /.test(l))out+="<h4>"+inline(l.replace(/^#+ /,""))+"</h4>";
    else if(l)out+="<p>"+inline(l)+"</p>";
  }
  if(inUl)out+="</ul>";return out;
}

  const d=daysLeft(m),st=statusOf(m),ms=monthStats(m),fs=fastState(m.fast);
  const total=m.months*30,pct=Math.max(0,Math.min(1,d/total));
  const al=alertsFor(m).filter(a=>a.lv!=="info"||a.date===undefined).slice(0,1)[0];
  const checked=(m.att||[]).includes(ymd(new Date()));
  const wk=[];for(let i=6;i>=0;i--)wk.push((m.att||[]).includes(ymd(addDays(today0(),-i))));
  const cls=CLASSES[new Date().getDay()];
  const b=bmi(m);
  let fastLine="";
  if(fs.phase==="off")fastLine='<p class="muted small">Fasting မစသေးပါ။</p><button class="btn teal sm" type="button" data-act="tab" data-v="fast">Fasting Mode ဖွင့်မယ်</button>';
  else if(fs.phase==="scheduled")fastLine='<p><b>'+fs.days+' ရက်</b> အကြာမှာ စတင်မယ်</p>';
  else if(fs.phase==="done")fastLine='<p><span class="chip good">ပြီးစီးပါပြီ 🎉</span></p>';
  else fastLine='<p><span class="chip '+(fs.phase==="fasting"?"warn":"good")+'">'+(fs.phase==="fasting"?"အစာရှောင်ချိန်":"စားနိုင်ချိန်")+'</span></p><p class="small muted" style="margin-top:6px">ပြီးဆုံးရန် '+fmtMin(fs.remain)+' · ရက် '+fs.dayNo+'/'+m.fast.days+'</p>';
  return '<div class="stack">'
  +(st!=="active"||d<=7?'<div class="banner '+(d<=3?"bad":"warn")+'"><p>'+esc(alertsFor(m)[0].t)+'</p><button class="btn sm primary" type="button" data-act="renewreq">သက်တမ်းတိုးလိုပါတယ်</button></div>':"")
  +'<div class="card hero"><div class="row spread" style="align-items:flex-start"><div><p class="muted small">မင်္ဂလာပါ</p><h2 style="font-size:1.6rem">'+esc(m.name)+'</h2><div class="row" style="margin-top:8px">'+tierChip(m.tier)+statusChip(m)+'</div></div>'
  +'<div class="ring">'+ringSvg(pct,112,"var(--accent)",10)+'<div class="mid"><b>'+Math.max(0,d)+'</b><span class="small muted">ရက်ကျန်</span></div></div></div>'
  +'<p class="small muted" style="margin-top:10px">သက်တမ်းကုန်ရက် '+fdate(expiryOf(m))+'</p></div>'
  +'<div class="grid c4"><div class="card stat"><b>'+m.weight+'<small style="font-size:.8rem"> kg</small></b><span>လက်ရှိ အလေးချိန်</span></div><div class="card stat"><b>'+m.height+'<small style="font-size:.8rem"> cm</small></b><span>အမြင့်</span></div><div class="card stat"><b>'+b.toFixed(1)+'</b><span>BMI · '+bmiLabel(b)+'</span></div><div class="card stat"><b style="font-size:1.05rem;font-family:var(--f-body)">'+GOALS[m.goal]+'</b><span>ပန်းတိုင် '+m.targetWeight+' kg</span></div></div>'
  +'<div class="grid c2"><div class="card stack"><div class="row spread"><h3>ဒီလ ရည်မှန်းချက်</h3><span class="chip">'+MM[new Date().getMonth()]+'</span></div>'
  +'<div><div class="row spread small"><span>Gym လာမှု</span><b class="num">'+ms.workouts+' / '+m.goalsM.workouts+' ရက်</b></div><div class="bar teal" style="margin-top:6px"><i style="width:'+Math.round(ms.wpct*100)+'%"></i></div></div>'
  +'<div><div class="row spread small"><span>အလေးချိန် ပြောင်းလဲမှု</span><b class="num">'+(ms.delta>0?"+":"")+ms.delta+' / '+(m.goalsM.delta>0?"+":"")+m.goalsM.delta+' kg</b></div><div class="bar" style="margin-top:6px"><i style="width:'+Math.round(ms.pct*100)+'%"></i></div></div>'
  +'<button class="btn '+(checked?"ghost":"primary")+'" type="button" data-act="checkin" '+(checked||st==="expired"?"disabled":"")+'>'+(checked?"ဒီနေ့ Check-in ပြီးပါပြီ ✓":st==="expired"?"Membership ကုန်နေပါတယ်":"ဒီနေ့ Gym ရောက်ပြီ · Check-in")+'</button>'
  +'<div><div class="small muted">လွန်ခဲ့သော ၇ ရက်</div><div class="wk" aria-hidden="true">'+wk.map(x=>'<i class="'+(x?"on":"")+'" style="height:'+(x?"100%":"14%")+'"></i>').join("")+'</div></div></div>'
  +'<div class="stack"><div class="card stack"><div class="row spread"><h3>Fasting</h3><button class="btn ghost sm" type="button" data-act="tab" data-v="fast">ကြည့်မယ်</button></div>'+fastLine+'</div>'
  +'<div class="card stack"><h3>ဒီနေ့ Class</h3>'+(m.tier==="normal"?'<p class="muted small">Class များသည် Premium နှင့် PT Player များအတွက်ဖြစ်ပါတယ်။</p>':cls.map(c=>'<div class="row spread"><span>'+esc(c)+'</span><span class="chip good">ဝင်နိုင်</span></div>').join(""))+'</div></div></div>'
  +(m.tier==="pt"?'<div class="card row spread"><div><h3>PT Session</h3><p class="muted small">Trainer: '+esc(m.trainer||"-")+'</p></div><div class="stat" style="text-align:right"><b>'+m.ptLeft+'</b><span>ကျန်သော Session</span></div></div>':"")
  +'<div class="card stack"><h3>Gym မှ ကြေညာချက်</h3>'+(S.ann.length?S.ann.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,3).map(a=>'<div><p>'+esc(a.text)+'</p><p class="small muted">'+fdate(a.date)+'</p></div>').join(""):'<p class="muted small">ကြေညာချက် မရှိသေးပါ။</p>')+'</div></div>';
}
function mGoals(m){
  const ms=monthStats(m);const to=+(m.weight-m.targetWeight).toFixed(1);
  return '<div class="stack"><h2>ရည်မှန်းချက်နှင့် ကိုယ်ခန္ဓာ</h2><div class="grid c21"><div class="card stack"><div class="row spread"><h3>အလေးချိန် ပြောင်းလဲမှု</h3><span class="chip">'+(to===0?"ပန်းတိုင်ရောက်ပြီ":(Math.abs(to))+" kg ကျန်"+(to>0?" (လျှော့ရန်)":" (တင်ရန်)"))+'</span></div>'+weightChart(m.wlog)
  +'<form data-form="wlog" class="row" style="align-items:flex-end"><div class="field" style="flex:1 1 140px"><label for="nw">ယနေ့ အလေးချိန် (kg)</label><input id="nw" name="w" type="number" step="0.1" min="20" max="300" required value="'+m.weight+'"></div><button class="btn primary" type="submit">မှတ်တမ်းတင်</button></form></div>'
  +'<div class="card stack"><h3>ဒီလ အနေအထား</h3><div><div class="row spread small"><span>Gym လာမှု</span><b class="num">'+ms.workouts+'/'+m.goalsM.workouts+'</b></div><div class="bar teal" style="margin-top:6px"><i style="width:'+Math.round(ms.wpct*100)+'%"></i></div></div><div><div class="row spread small"><span>အလေးချိန်</span><b class="num">'+(ms.delta>0?"+":"")+ms.delta+'/'+(m.goalsM.delta>0?"+":"")+m.goalsM.delta+' kg</b></div><div class="bar" style="margin-top:6px"><i style="width:'+Math.round(ms.pct*100)+'%"></i></div></div><p class="small muted">ရည်မှန်းချက်ကို အောက်ပါ Profile တွင် ပြင်နိုင်ပါတယ်။</p></div></div>'
  +'<form class="card form" data-form="profile"><h3 class="full">ကိုယ်ပိုင် Profile</h3>'
  +fld("အမြင့် (cm)","height","number",m.height,'min="100" max="230"')+fld("လက်ရှိ အလေးချိန် (kg)","weight","number",m.weight,'step="0.1" min="20" max="300"')+fld("ပန်းတိုင် အလေးချိန် (kg)","targetWeight","number",m.targetWeight,'step="0.1" min="20" max="300"')
  +'<div class="field"><label for="f-goal">ပန်းတိုင်</label><select id="f-goal" name="goal">'+Object.keys(GOALS).map(k=>'<option value="'+k+'"'+(m.goal===k?" selected":"")+'>'+GOALS[k]+'</option>').join("")+'</select></div>'
  +fld("လစဉ် Gym လာမည့်ရက်","gw","number",m.goalsM.workouts,'min="1" max="31"')+fld("လစဉ် အလေးချိန်ပြောင်း (kg, လျှော့လျှင် အနုတ်)","gd","number",m.goalsM.delta,'step="0.5" min="-10" max="10"')
  +'<div class="full"><button class="btn primary" type="submit">သိမ်းမယ်</button></div></form></div>';
}
function fld(label,name,type,val,extra){return '<div class="field"><label for="f-'+name+'">'+label+'</label><input id="f-'+name+'" name="'+name+'" type="'+type+'" value="'+esc(val)+'" '+(extra||"")+'></div>'}
function mFast(m){
  const f=m.fast,fs=fastState(f);
  let body="";
  if(fs.phase==="off"||fs.phase==="done"){
    const today=ymd(new Date());
    body='<div class="card stack"><div><h2>Fasting Challenge</h2><p class="muted">Intermittent Fasting ကို စိတ်ပါလျှင် ဝင်ရောက်လိုက်ပါ။ ဒီနေ့ကစမလား၊ နောက်ရက်တစ်ရက်ကို ရွေးမလား ရွေးနိုင်ပါတယ်။</p></div>'
    +(fs.phase==="done"?'<div class="banner info"><p>ယခင် Challenge '+f.days+' ရက် ပြီးစီးပါပြီ။ အသစ်ပြန်စနိုင်ပါတယ်။</p></div>':"")
    +'<div class="field"><label>Protocol ရွေးပါ</label><div class="seg" role="group">'+PROTOCOLS.map(p=>'<button type="button" data-act="proto" data-v="'+p.f+'" aria-pressed="'+(f.fast===p.f)+'">'+p.n+' · '+p.d+'</button>').join("")+'</div></div>'
    +'<form data-form="fast-start" class="form"><div class="field"><label for="es">စားနိုင်ချိန် စတင်ရန်</label><input id="es" type="time" name="eatStart" value="'+f.eatStart+'" required></div>'
    +'<div class="field"><label for="dy">Challenge ကာလ</label><select id="dy" name="days">'+[7,14,21,30].map(n=>'<option value="'+n+'"'+(f.days===n?" selected":"")+'>'+n+' ရက်</option>').join("")+'</select></div>'
    +'<div class="field full"><label>စတင်မည့်နေ့</label><div class="seg" role="group"><button type="button" data-act="pick" data-v="today" aria-pressed="'+(UI.pick==="today")+'">ဒီနေ့ကစမယ်</button><button type="button" data-act="pick" data-v="date" aria-pressed="'+(UI.pick==="date")+'">ရက်ရွေးမယ်</button></div></div>'
    +(UI.pick==="date"?'<div class="field full"><label for="sd">စတင်မည့်ရက်</label><input id="sd" type="date" name="startDate" min="'+today+'" value="'+ymd(addDays(today0(),1))+'" required></div>':"")
    +'<div class="full"><button class="btn teal" type="submit">Fasting Mode ဖွင့်မယ်</button></div></form></div>';
  }else{
    const col=fs.phase==="fasting"?"var(--accent)":"var(--teal)";
    const st=streakOf(f.checkins);const doneToday=(f.checkins||[]).includes(ymd(new Date()));
    body='<div class="card stack hero" style="align-items:center;text-align:center">'
    +(fs.phase==="scheduled"?'<h2>စတင်ရန် '+fs.days+' ရက်ကျန်</h2><p class="muted">'+fdate(f.startDate)+' မှာ '+PROTOCOLS.find(p=>p.f===f.fast).n+' စတင်မယ်</p>'
      :'<span class="chip '+(fs.phase==="fasting"?"warn":"good")+'">'+(fs.phase==="fasting"?"အစာရှောင်ချိန်":"စားနိုင်ချိန်")+' · ရက် '+fs.dayNo+'/'+f.days+'</span>'
       +'<div class="ring">'+ringSvg(fs.pct,220,col,16)+'<div class="mid"><b>'+fmtMin(fs.remain).replace(" နာရီ ",":").replace(" မိနစ်","")+'</b><span class="small muted">'+(fs.phase==="fasting"?"စားနိုင်ရန် ကျန်ချိန်":"အစာရှောင်ရန် ကျန်ချိန်")+'</span></div></div>'
       +'<p class="muted small">စားနိုင်ချိန် '+f.eatStart+' မှ '+hhmm(+f.eatStart.split(":")[0]*60+ +f.eatStart.split(":")[1]+(24-f.fast)*60)+' · Protocol '+PROTOCOLS.find(p=>p.f===f.fast).n+'</p>')
    +'<div class="row" style="justify-content:center"><button class="btn '+(doneToday?"ghost":"primary")+'" type="button" data-act="fcheck" '+(doneToday||fs.phase==="scheduled"?"disabled":"")+'>'+(doneToday?"ဒီနေ့ အောင်မြင်ပြီ ✓":"ဒီနေ့ အောင်မြင်ပြီ မှတ်မယ်")+'</button><button class="btn danger" type="button" data-act="fstop">ရပ်မယ်</button></div></div>'
    +'<div class="grid tiny"><div class="card stat"><b>'+st+'</b><span>ဆက်တိုက် အောင်မြင်ရက်</span></div><div class="card stat"><b>'+(f.checkins||[]).length+'</b><span>စုစုပေါင်း အောင်မြင်ရက်</span></div><div class="card stat"><b>'+Math.max(0,f.days-(fs.dayNo||0))+'</b><span>Challenge ကျန်ရက်</span></div></div>';
  }
  return '<div class="stack">'+body+'<div class="card stack"><h3>အစာရှောင်စဉ် သတိထားရန်</h3><ul class="muted small" style="margin:0;padding-left:20px"><li>ရေ၊ လက်ဖက်ရည်ကြမ်း (သကြားမပါ) သောက်နိုင်ပါတယ်။</li><li>မူးဝေလာလျှင် သို့မဟုတ် ဝမ်းလျှောလျှင် ရပ်ပါ။</li><li>ကိုယ်ဝန်ဆောင်၊ ဆီးချို၊ ဆေးသောက်နေသူများ ဆရာဝန်နှင့် အရင်တိုင်ပင်ပါ။</li></ul></div></div>';
}

/* ---------- render ---------- */
function render() {
  const root = document.getElementById("app");
  if (UI.fatal) { root.innerHTML = viewFatal(); return }
  if (UI.loading) { root.innerHTML = viewLoading(); return }
  if (!CUR) { root.innerHTML = viewLogin(UI.err); return }
  let html;
  if (CUR.role === "admin") {
    if (!ATABS.some(t => t[0] === UI.tab)) UI.tab = "dash";
    html = shell(ATABS, { dash: aDash, members: aMembers, expiring: aExpiring, ann: aAnn, set: aSettings }[UI.tab](), null);
  } else {
    const m = S.me;
    if (!m) { root.innerHTML = viewLoading(); return }
    if (!MTABS.some(t => t[0] === UI.tab)) UI.tab = "home";
    html = shell(MTABS, { home: mHome, goals: mGoals, fast: mFast, ai: mAI, plan: x => mPlan(x) + pwCard() }[UI.tab](m), m);
  }
  if (UI.modal && CUR.role === "admin") html += modalMember();
  if (UI.notif && CUR.role === "member" && S.me) html += notifSheet(S.me);
  root.innerHTML = html;
}
/* Live updates from Firestore must not wipe what someone is typing. */
function renderSoft() {
  const a = document.activeElement;
  if (a && a.matches && a.matches("input,select,textarea") && a.closest("#app")) return;
  render();
}

async function askAI(m, diet, note) {
  const fs = fastState(m.fast), n = calcNeeds(m);
  const prompt = "သင်သည် Gym အတွက် အစားအသောက်လမ်းညွှန် ဖြစ်ပါတယ်။ မြန်မာဘာသာဖြင့်သာ ဖြေပါ။ မြန်မာလူမျိုးများ ရရှိလွယ်သော အစားအစာများ (ထမင်း၊ ကြက်သား၊ ငါး၊ ပဲ၊ ဟင်းသီးဟင်းရွက်) ကို အဓိကထားပါ။\n"

    + "အစားအစာအမျိုးအစား: " + (diet === "v" ? "သက်သတ်လွတ်" : "ပုံမှန်") + "\n"
    + (m.fast.on ? "Fasting: " + m.fast.fast + " နာရီ ရှောင်၊ စားနိုင်ချိန် " + m.fast.eatStart + " မှ စ၍ " + (24 - m.fast.fast) + " နာရီ။ အစားအစာကို အဲဒီအချိန်အတွင်းသာ စီစဉ်ပါ။\n" : "")
    + (note ? "မှတ်ချက်: " + note + "\n" : "")
    + "ဒီနေ့အတွက် အချိန်၊ အစားအစာ၊ kcal ပါသော Meal Plan နှင့် အကျဉ်းချုပ် အကြံပြုချက် ၃ ချက် ပေးပါ။ Markdown ဖြင့် (#### ခေါင်းစဉ်၊ - စာရင်း၊ **စာလုံးမည်း**) ရေးပါ။ ၃၀၀ စာလုံးအောက်။ နောက်ဆုံးမှာ ဆေးဘက်ဆိုင်ရာ အကြံပေးမဟုတ်ကြောင်း တစ်ကြောင်း ထည့်ပါ။";
  let failed = false;
  if (aiReady()) {
    try {
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(S.ai.model) + ":generateContent", { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": S.ai.key }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const t = j.candidates && j.candidates[0] && j.candidates[0].content.parts.map(p => p.text).join("");
      if (t) return { text: t, src: "Gemini" };
      failed = true;
    } catch (e) { failed = true }
  }
  return { text: localText(m, diet, Math.floor(Math.random() * 3), fs), src: failed ? "App ထဲက တွက်ချက်မှု (Gemini မရသဖြင့်)" : "App ထဲက တွက်ချက်မှု" };
}

/* ---------- actions ---------- */
const mref = () => doc(db, "members", CUR.uid);
/* Writes show their message at once; Firestore updates the screen locally and reports a failure afterwards. */
function write(fn, ok) { if (ok) toast(ok); Promise.resolve().then(fn).catch(e => toast(errMsg(e))) }
function setTheme() {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const n = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", n);
  try { localStorage.setItem("flexifit_theme", n) } catch (e) { }
}
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === "closem") { if (ev.target !== el && el.classList.contains("overlay")) return; UI.modal = null; UI.notif = false; return render() }
  switch (a) {
    case "lg": UI.lg = v; UI.err = ""; UI.lastId = ""; return render();
    case "tab": UI.tab = v; UI.notif = false; window.scrollTo(0, 0); return render();
    case "notif": UI.notif = true; return render();
    case "logout": UI.err = ""; UI.fatal = ""; try { await signOut(auth) } catch (e) { } UI.loading = false; return render();
    case "reload": location.reload(); return;
    case "theme": return setTheme();
    case "checkin": return write(() => updateDoc(mref(), { att: arrayUnion(ymd(new Date())) }), "Check-in အောင်မြင်ပါတယ် 💪");
    case "renewreq": return write(() => updateDoc(mref(), { renewReq: true }), "Front desk ထံ တောင်းဆိုပြီးပါပြီ");
    case "proto": return write(() => updateDoc(mref(), { "fast.fast": +v }));
    case "pick": UI.pick = v; return render();
    case "fcheck": return write(() => updateDoc(mref(), { "fast.checkins": arrayUnion(ymd(new Date())) }), "ဒီနေ့ အောင်မြင်ပါတယ်!");
    case "fstop": return write(() => updateDoc(mref(), { "fast.on": false }), "Fasting Mode ပိတ်လိုက်ပါပြီ");
    case "diet": UI.diet = v; return render();
    case "add": UI.modal = { id: null }; return render();
    case "edit": UI.modal = { id: v }; return render();
    case "delm": UI.modal = null; render(); return write(() => deleteDoc(doc(db, "members", v)), "Member စာရင်းမှ ဖျက်ပြီးပါပြီ");
    case "renew": {
      const x = S.members.find(y => y.id === v); if (!x) return;
      const patch = daysLeft(x) < 0 ? { start: ymd(new Date()), months: 1, renewReq: false } : { months: x.months + 1, renewReq: false };
      return write(() => updateDoc(doc(db, "members", v), patch), x.name + " သက်တမ်း တိုးပြီး");
    }
    case "remind": return write(() => updateDoc(doc(db, "members", v), { notes: arrayUnion({ text: "Gym မှ သတိပေးချက် - Membership သက်တမ်းတိုးရန် Front desk သို့ လာပါ။", date: ymd(new Date()) }) }), "သတိပေးချက် ပို့ပြီးပါပြီ");
    case "delann": return write(() => deleteDoc(doc(db, "announcements", v)));
  }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "q") { UI.q = ev.target.value; document.getElementById("mlist").innerHTML = memberRows() }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "ft" || ev.target.id === "fs") { UI[ev.target.id] = ev.target.value; document.getElementById("mlist").innerHTML = memberRows() }
});
document.addEventListener("submit", async ev => {
  const f = ev.target.closest("form[data-form]"); if (!f) return; ev.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries()), k = f.dataset.form, m = S.me;
  if (k === "login-member" || k === "login-admin") {
    const isM = k === "login-member";
    UI.lastId = isM ? (d.phone || "") : (d.email || "");
    if (isM && !/^\d{7,15}$/.test(String(d.phone || "").replace(/\D/g, ""))) { UI.err = "ဖုန်းနံပါတ် မှန်မမှန် စစ်ပါ။"; return render() }
    UI.busy = true; UI.err = ""; render();
    try { await signInWithEmailAndPassword(auth, isM ? emailOf(d.phone) : (d.email || "").trim(), d.password || ""); UI.busy = false; return }
    catch (e) { UI.err = loginErr(e); UI.busy = false; return render() }
  }
  if (k === "wlog") {
    const w = +d.w, t = ymd(new Date());
    const arr = (m.wlog || []).filter(l => l.d !== t).concat([{ d: t, w: w }]);
    return write(() => updateDoc(mref(), { wlog: arr, weight: w }), "မှတ်တမ်းတင်ပြီးပါပြီ");
  }
  if (k === "profile") return write(() => updateDoc(mref(), { height: +d.height, weight: +d.weight, targetWeight: +d.targetWeight, goal: d.goal, goalsM: { workouts: +d.gw, delta: +d.gd } }), "Profile သိမ်းပြီးပါပြီ");
  if (k === "fast-start") {
    const sd = UI.pick === "date" && d.startDate ? d.startDate : ymd(new Date());
    return write(() => updateDoc(mref(), { fast: { on: true, fast: m.fast.fast, eatStart: d.eatStart, startDate: sd, days: +d.days, checkins: [] } }), "Fasting Mode ဖွင့်ပြီးပါပြီ");
  }
  if (k === "ai") { UI.note = d.note || ""; UI.aiBusy = true; render(); const r = await askAI(m, UI.diet, UI.note); UI.aiBusy = false; UI.aiOut = r.text; UI.aiSrc = r.src; return render() }
  if (k === "pw") {
    if (d.pw1 !== d.pw2) { toast("စကားဝှက် နှစ်ခု မတူပါ"); return }
    try { await updatePassword(auth.currentUser, d.pw1); toast("စကားဝှက် ပြောင်းပြီးပါပြီ"); f.reset() } catch (e) { toast(errMsg(e)) }
    return;
  }
  if (k === "aikey") return write(() => setDoc(doc(db, "settings", "ai"), { key: (d.key || "").trim(), model: (d.model || "").trim().replace(/^models\//, "") }), "သိမ်းပြီးပါပြီ");
  if (k === "ann") { f.reset(); return write(() => addDoc(collection(db, "announcements"), { date: ymd(new Date()), text: d.text.trim(), ts: serverTimestamp() }), "ကြေညာပြီးပါပြီ") }
  if (k === "member") {
    const id = UI.modal && UI.modal.id;
    const base = { name: d.name.trim(), sex: d.sex, age: +d.age, tier: d.tier, start: d.start, months: +d.months, height: +d.height, weight: +d.weight, targetWeight: +d.targetWeight, goal: d.goal, trainer: d.tier === "pt" ? (d.trainer || "") : "", ptLeft: d.tier === "pt" ? +d.ptLeft : 0 };
    if (id) { UI.modal = null; render(); return write(() => updateDoc(doc(db, "members", id), base), "သိမ်းပြီးပါပြီ") }
    const ph = String(d.phone).replace(/\D/g, "");
    if (!/^\d{7,15}$/.test(ph)) { toast("ဖုန်းနံပါတ် မှန်မမှန် စစ်ပါ"); return }
    if (S.members.some(x => x.phone === ph)) { toast("ဒီဖုန်းနံပါတ်ဖြင့် Member ရှိပြီးသားပါ"); return }
    toast("Member ဖန်တီးနေပါတယ်…");
    try {
      const uid = await createAuthUser(emailOf(ph), d.password);
      await setDoc(doc(db, "members", uid), Object.assign({ phone: ph, wlog: [{ d: ymd(new Date()), w: base.weight }], att: [], goalsM: { workouts: 12, delta: (base.goal === "gain" || base.goal === "muscle") ? 1 : -2 }, fast: newFast(), notes: [], renewReq: false, createdAt: serverTimestamp() }, base));
      UI.modal = null; toast("Member ထည့်ပြီးပါပြီ");
    } catch (e) { toast(errMsg(e)) }
    render(); return;
  }
});
/* keep the fasting countdown fresh while that tab is open */
setInterval(() => { if (CUR && CUR.role === "member" && UI.tab === "fast" && !UI.modal && !(document.activeElement && document.activeElement.matches("input,select,textarea"))) render() }, 60000);

/* ---------- boot ---------- */
render();
onAuthStateChanged(auth, async user => {
  stopListening();
  UI.busy = false;
  if (!user) { CUR = null; S.members = []; S.me = null; UI.loading = false; return render() }
  UI.loading = true; UI.fatal = ""; render();
  try {
    const adm = await getDoc(doc(db, "admins", user.uid));
    if (adm.exists()) {
      CUR = { role: "admin", uid: user.uid }; UI.tab = "dash";
      unsubs.push(onSnapshot(collection(db, "members"), snap => { S.members = snap.docs.map(x => Object.assign({}, x.data(), { id: x.id })); renderSoft() }, fail));
    } else {
      const mem = await getDoc(doc(db, "members", user.uid));
      if (!mem.exists()) { UI.err = "ဒီ account က FlexiFit Member စာရင်းထဲ မပါပါ။ Front desk မှာ စာရင်းသွင်းပါ။"; await signOut(auth); return }
      CUR = { role: "member", uid: user.uid }; UI.tab = "home";
      unsubs.push(onSnapshot(doc(db, "members", user.uid), s => { if (!s.exists()) { signOut(auth); return } S.me = Object.assign({}, s.data(), { id: s.id }); renderSoft() }, fail));
    }
    unsubs.push(onSnapshot(collection(db, "announcements"), snap => { S.ann = snap.docs.map(x => Object.assign({}, x.data(), { id: x.id })); renderSoft() }, () => { }));
    unsubs.push(onSnapshot(doc(db, "settings", "ai"), s => { S.ai = s.exists() ? Object.assign({ key: "", model: "" }, s.data()) : { key: "", model: "" }; renderSoft() }, () => { }));
    UI.err = ""; UI.loading = false; render();
  } catch (e) { fail(e) }
});
</script>

</body>
</html>
